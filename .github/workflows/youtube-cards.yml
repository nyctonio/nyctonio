name: GitHub Readme YouTube Cards
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # YouTube RSS feeds are gone; the action needs a Data API key
      HAS_KEY: ${{ secrets.YOUTUBE_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "YOUTUBE_API_KEY secret not set, skipping"
      - if: env.HAS_KEY == 'true'
        uses: DenverCoder1/github-readme-youtube-cards@main
        with:
          channel_id: UCnfInibS24FiHtTIPaYcrYw
          youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
